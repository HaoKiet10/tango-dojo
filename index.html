<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện Kanji &amp; Từ vựng · 漢字と語彙</title>
<style>
  :root{
    --bg:#f7f3ec; --card:#fffdf9; --ink:#2b2622; --muted:#8a8178; --line:#e6dfd4;
    --red:#c8442f; --green:#3f8a5a; --accent:#c8442f; --soft:#f1e9dc;
    --jp:"Yu Gothic","Meiryo","Hiragino Sans","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Be Vietnam Pro",system-ui,sans-serif;min-height:100vh}
  .jp{font-family:var(--jp)}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{margin:0;font-size:20px;font-weight:600}
  h1 span{color:var(--accent);font-family:var(--jp);margin-left:8px}
  nav{display:flex;align-items:center;gap:4px}
  nav button{background:none;border:0;font:inherit;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted)}
  nav button.on{background:var(--ink);color:#fff}
  nav a{color:var(--muted);font-size:14px;margin-left:10px}
  main{max-width:900px;margin:0 auto;padding:24px 20px 60px}
  .panel{display:none}.panel.on{display:block}

  /* settings */
  .settings{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  .group{display:flex;flex-wrap:wrap;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
  .group button{background:none;border:0;font:inherit;font-size:14px;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--ink)}
  .group button.on{background:var(--accent);color:#fff}
  .group button:disabled{opacity:.35;cursor:not-allowed}

  /* stage */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 24px 26px;text-align:center;box-shadow:0 2px 0 var(--line);min-height:380px;position:relative}
  .tag{position:absolute;top:14px;left:16px;font-size:12px;color:var(--muted);background:var(--soft);padding:3px 10px;border-radius:999px}
  .prompt{font-family:var(--jp);font-size:96px;line-height:1.15;margin:16px 0 4px;word-break:keep-all}
  .prompt.word{font-size:64px}
  .prompt.en{font-family:inherit;font-size:30px;font-weight:600;margin:34px 0 14px}
  .sub{color:var(--muted);font-size:14px;min-height:20px}
  .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:560px;margin:22px auto 0}
  .choices button{font:inherit;font-size:19px;padding:14px 10px;border:2px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center}
  .choices button .n{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .choices button.jpopt{font-family:var(--jp);font-size:24px}
  .choices button:hover:not(:disabled){border-color:var(--ink)}
  .choices button.right{background:var(--green);border-color:var(--green);color:#fff}
  .choices button.wrong{background:var(--red);border-color:var(--red);color:#fff}
  .choices button.right .n,.choices button.wrong .n{color:#fff;border-color:rgba(255,255,255,.5)}

  .typebox{margin-top:22px}
  .typebox input{font:inherit;font-size:22px;text-align:center;width:300px;max-width:90%;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff;outline:none}
  .typebox input:focus{border-color:var(--ink)}
  .kanaPreview{font-family:var(--jp);font-size:26px;min-height:38px;margin-top:8px;color:var(--ink)}

  .sentence{font-family:var(--jp);font-size:30px;line-height:1.7;margin:30px auto 6px;max-width:680px}
  .blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--accent);color:var(--accent);margin:0 4px;line-height:1.2}
  .english{color:var(--muted);font-size:15px;font-style:italic}

  /* spell */
  .slots{display:flex;justify-content:center;gap:6px;margin:20px 0 6px;min-height:58px;flex-wrap:wrap}
  .slot{min-width:50px;height:54px;border-bottom:3px solid var(--line);font-family:var(--jp);font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 4px}
  .slot.filled{border-color:var(--ink)}
  .tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
  .tile{font-family:var(--jp);font-size:26px;min-width:54px;padding:8px 10px;background:#fff;border:2px solid var(--line);border-radius:10px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
  .tile:hover{border-color:var(--ink)}
  .tile.used{visibility:hidden}
  .slots.right .slot{color:var(--green);border-color:var(--green)}
  .slots.wrong .slot{color:var(--red);border-color:var(--red)}

  /* match */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;align-items:stretch;max-width:640px;margin:22px auto 0}
  .col{display:contents} /* cards sit directly in the .match grid so each row shares one height */
  .m{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;user-select:none;min-height:56px;display:flex;align-items:center;justify-content:center;transition:transform .1s}
  .m.left{font-family:var(--jp);font-size:28px;touch-action:none;cursor:grab}
  .m.right{font-size:16px}
  .m.right.jpopt{font-family:var(--jp);font-size:22px}
  .m.sel{border-color:var(--ink);transform:scale(1.03)}
  .m.over{border-color:var(--accent);background:var(--soft)}
  .m.done{background:var(--green);border-color:var(--green);color:#fff;cursor:default}
  .m.bad{background:var(--red);border-color:var(--red);color:#fff}
  .m.done.late{background:#d48a2c;border-color:#d48a2c} /* matched, but only after a wrong try */
  .ghost{position:fixed;pointer-events:none;z-index:50;font-family:var(--jp);font-size:28px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 16px;box-shadow:0 8px 20px rgba(0,0,0,.15);transform:translate(-50%,-50%)}

  /* flashcard */
  .flash{max-width:520px;margin:18px auto 0;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer}
  .rate{display:flex;gap:10px;justify-content:center;margin-top:18px}
  .btn{font:inherit;font-size:16px;padding:10px 22px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
  .btn.ghostbtn{background:#fff;color:var(--ink)}
  .btn.red{background:var(--red);border-color:var(--red)}
  .btn.green{background:var(--green);border-color:var(--green)}

  /* feedback */
  .feedback{margin:22px auto 0;max-width:640px;border-radius:14px;padding:16px 18px;text-align:left;display:none}
  .feedback.show{display:flex;flex-direction:column;gap:14px}
  .feedback.ok{background:#e7f2ea;color:#244f33}
  .feedback.no{background:#f8e3df;color:#6e2316}
  .info{line-height:1.5;text-align:left}
  .cardback{width:100%;max-width:600px;margin:6px auto 0;background:var(--soft);border-radius:14px;padding:16px 18px}
  .cardback .head .big{display:none}
  .info .verdict{font-weight:700;font-size:15px;margin-bottom:4px}
  .info .head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
  .info .big{font-family:var(--jp);font-size:30px}
  .info .r{font-family:var(--jp)}
  .info .head .r{font-size:18px}
  .info .wm{font-weight:600;font-size:17px}
  .feedback #nextBtn{align-self:flex-end}
  .info .hvbig{font-weight:700;font-size:20px}
  .info .rdline{font-size:14px;opacity:.85;margin-top:2px}
  .info .example{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,.08)}
  .info .exlabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
  .info .exw{font-size:22px}
  .parts{width:100%;margin-top:10px;border-collapse:collapse;font-size:15px}
  .parts td{padding:7px 8px;border-top:1px solid rgba(0,0,0,.08);vertical-align:middle}
  .parts .kc{font-family:var(--jp);font-size:24px;width:44px;text-align:center}
  .parts .hv{font-weight:700;width:96px;white-space:nowrap}
  .parts .rd{font-family:var(--jp);font-size:13px;opacity:.8;text-align:right;white-space:nowrap}
  .parts .now{display:inline-block;font-family:"Segoe UI",sans-serif;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;margin-left:8px;vertical-align:2px}
  .card.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .stats{display:flex;justify-content:center;gap:34px;margin-top:20px;color:var(--muted);font-size:14px;flex-wrap:wrap}
  .stats b{display:block;color:var(--ink);font-size:22px;text-align:center}

  /* progress */
  .prog h2{font-size:15px;color:var(--muted);font-weight:600;margin:24px 0 10px}
  .bars{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
  .track{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;display:flex}
  .track i{display:block;height:100%}
  .track .l{background:var(--green)} .track .s{background:#e5c27a}
  .legend{font-size:12px;color:var(--muted);margin-top:8px}
  .weak{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .weak div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
  .weak .w{font-family:var(--jp);font-size:20px;margin-right:6px}
  .weak .x{color:var(--red);float:right;font-size:12px}
  .tip{color:var(--muted);font-size:13px}
  .reset{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;margin-top:18px}
  @media (max-width:600px){ .prompt{font-size:72px} .prompt.word{font-size:46px} .choices,.bars{grid-template-columns:1fr} .match{gap:10px} }
</style>
</head>
<body>
<header>
  <h1>Luyện Kanji &amp; Từ vựng<span>漢字と語彙 · N4–N3</span></h1>
  <nav>
    <button data-tab="practice" class="on">Luyện tập 練習</button>
    <button data-tab="progress">Tiến độ 進捗</button>
    <a href="kana.html">Luyện Kana →</a>
  </nav>
</header>

<main>
  <section id="practice" class="panel on">
    <div class="settings">
      <div class="group" id="deck">
        <button data-v="kanji">Kanji 漢字</button>
        <button data-v="vocab">Từ vựng 語彙</button>
      </div>
      <div class="group" id="level">
        <button data-v="4">N4</button>
        <button data-v="3">N3</button>
        <button data-v="both">Cả hai</button>
      </div>
      <div class="group" id="mode">
        <button data-v="mixed">Hỗn hợp</button>
        <button data-v="choice">Trắc nghiệm</button>
        <button data-v="match">Kéo nối</button>
        <button data-v="type">Gõ cách đọc</button>
        <button data-v="spell">Ghép cách đọc</button>
        <button data-v="fill">Điền chỗ trống</button>
        <button data-v="cards">Thẻ ghi nhớ</button>
      </div>
    </div>

    <div class="card" id="card">
      <div class="tag" id="tag"></div>
      <div id="stage"></div>
      <div class="feedback" id="feedback"><div class="info" id="fbInfo"></div><button class="btn" id="nextBtn">Tiếp 次へ →</button></div>
    </div>

    <div class="stats">
      <div><b id="sCorrect">0</b>câu đúng</div>
      <div><b id="sAcc">–</b>tỉ lệ đúng</div>
      <div><b id="sStreak">0</b>chuỗi đúng</div>
      <div><b id="sBest">0</b>kỷ lục</div>
    </div>
  </section>

  <section id="progress" class="panel prog">
    <h2>Bạn đã thuộc bao nhiêu</h2>
    <div class="bars" id="bars"></div>
    <div class="legend">■ <span style="color:var(--green)">đã thuộc</span> (đúng từ 3 lần trở lên, phần lớn là đúng) &nbsp; ■ <span style="color:#c79a3a">đã gặp</span></div>
    <h2>Những chữ hay sai nhất — sẽ xuất hiện thường xuyên hơn</h2>
    <div class="weak" id="weak"></div>
    <button class="reset" id="reset">Xóa toàn bộ tiến độ</button>
  </section>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
