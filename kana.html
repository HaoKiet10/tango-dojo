<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện Kana · かな練習</title>
<style>
  :root{
    --bg:#f7f3ec; --card:#fffdf9; --ink:#2b2622; --muted:#8a8178; --line:#e6dfd4;
    --red:#c8442f; --green:#3f8a5a; --accent:#c8442f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.3px}
  h1 span{color:var(--accent);font-family:"Yu Gothic","Meiryo",sans-serif;margin-left:8px}
  nav button{background:none;border:0;font:inherit;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted)}
  nav button.on{background:var(--ink);color:#fff}
  main{max-width:860px;margin:0 auto;padding:28px 20px 60px}
  .panel{display:none}.panel.on{display:block}

  .settings{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:22px}
  .group{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
  .group label{padding:6px 12px;border-radius:7px;cursor:pointer;font-size:14px;user-select:none}
  .group input{display:none}
  .group input:checked + span{color:#fff}
  .group label:has(input:checked){background:var(--accent);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:40px 24px;text-align:center;box-shadow:0 2px 0 var(--line)}
  .kana{font-family:"Yu Gothic","Meiryo","Hiragino Sans",sans-serif;font-size:120px;line-height:1.1;margin:0 0 6px}
  .hint{color:var(--muted);font-size:13px;min-height:18px}
  .answer{margin-top:22px}
  .answer input{font:inherit;font-size:24px;text-align:center;width:220px;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff;outline:none}
  .answer input:focus{border-color:var(--ink)}
  .choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:22px auto 0}
  .choices button{font:inherit;font-size:20px;padding:14px 0;border:2px solid var(--line);background:#fff;border-radius:12px;cursor:pointer}
  .choices button:hover{border-color:var(--ink)}
  .choices button.right{background:var(--green);border-color:var(--green);color:#fff}
  .choices button.wrong{background:var(--red);border-color:var(--red);color:#fff}
  .feedback{margin-top:16px;font-size:18px;min-height:26px;font-weight:600}
  .nextbtn{margin-top:14px;font:inherit;font-size:16px;padding:10px 24px;border-radius:10px;border:0;background:var(--ink);color:#fff;cursor:pointer}
  .feedback.ok{color:var(--green)} .feedback.no{color:var(--red)}
  .card.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .stats{display:flex;justify-content:center;gap:34px;margin-top:22px;color:var(--muted);font-size:14px}
  .stats b{display:block;color:var(--ink);font-size:22px}
  .weak{margin-top:28px}
  .weak h3{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 10px}
  .weak .list{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px}
  .chip small{color:var(--red);margin-left:4px}
  .reset{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;margin-top:14px}

  .chart h2{font-size:15px;color:var(--muted);font-weight:600;margin:26px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .grid.y{grid-template-columns:repeat(3,1fr)}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 0;text-align:center;cursor:pointer}
  .cell:hover{border-color:var(--accent)}
  .cell .k{font-family:"Yu Gothic","Meiryo",sans-serif;font-size:30px}
  .cell .r{font-size:12px;color:var(--muted)}
  .cell.empty{visibility:hidden}
  .tip{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Luyện Kana<span>かな練習</span></h1>
  <nav>
    <button data-tab="quiz" class="on">Kiểm tra テスト</button>
    <button data-tab="chart">Bảng chữ 五十音表</button>
    <a href="index.html" style="margin-left:10px;color:var(--muted);font-size:14px">← Kanji &amp; Từ vựng</a>
  </nav>
</header>

<main>
  <section id="quiz" class="panel on">
    <div class="settings">
      <div class="group" id="script">
        <label><input type="radio" name="script" value="h" checked><span>Hiragana</span></label>
        <label><input type="radio" name="script" value="k"><span>Katakana</span></label>
        <label><input type="radio" name="script" value="hk"><span>Cả hai</span></label>
      </div>
      <div class="group" id="sets">
        <label><input type="checkbox" value="basic" checked><span>Cơ bản</span></label>
        <label><input type="checkbox" value="dakuten"><span>が・ぱ</span></label>
        <label><input type="checkbox" value="yoon"><span>きゃ</span></label>
      </div>
      <div class="group" id="mode">
        <label><input type="radio" name="mode" value="type" checked><span>Gõ romaji</span></label>
        <label><input type="radio" name="mode" value="choice"><span>Trắc nghiệm</span></label>
      </div>
    </div>

    <div class="card" id="card">
      <p class="kana" id="kana">あ</p>
      <div class="hint" id="hint">Gõ cách đọc rồi nhấn Enter · Tab để bỏ qua · bấm vào chữ để nghe</div>
      <div class="answer" id="typeBox"><input id="input" autocomplete="off" spellcheck="false" placeholder="romaji"></div>
      <div class="choices" id="choices" hidden></div>
      <div class="feedback" id="feedback"></div>
      <button class="nextbtn" id="nextBtn" hidden>Tiếp 次へ →</button>
    </div>

    <div class="stats">
      <div><b id="sCorrect">0</b>câu đúng</div>
      <div><b id="sAcc">–</b>tỉ lệ đúng</div>
      <div><b id="sStreak">0</b>chuỗi đúng</div>
      <div><b id="sBest">0</b>kỷ lục</div>
    </div>

    <div class="weak">
      <h3>Chữ hay sai nhất (sẽ xuất hiện nhiều hơn)</h3>
      <div class="list" id="weakList"><span class="tip">Chưa có — cố lên!</span></div>
      <button class="reset" id="reset">Xóa tiến độ</button>
    </div>
  </section>

  <section id="chart" class="panel chart">
    <div class="settings">
      <div class="group" id="chartScript">
        <label><input type="radio" name="cs" value="h" checked><span>Hiragana</span></label>
        <label><input type="radio" name="cs" value="k"><span>Katakana</span></label>
      </div>
    </div>
    <p class="tip">Bấm vào chữ bất kỳ để nghe phát âm.</p>
    <div id="chartBody"></div>
  </section>
</main>

<script>
// [hiragana, romaji, alternate readings...]
const BASIC = [
  ["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"],
  ["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"],
  ["さ","sa"],["し","shi","si"],["す","su"],["せ","se"],["そ","so"],
  ["た","ta"],["ち","chi","ti"],["つ","tsu","tu"],["て","te"],["と","to"],
  ["な","na"],["に","ni"],["ぬ","nu"],["ね","ne"],["の","no"],
  ["は","ha"],["ひ","hi"],["ふ","fu","hu"],["へ","he"],["ほ","ho"],
  ["ま","ma"],["み","mi"],["む","mu"],["め","me"],["も","mo"],
  ["や","ya"],null,["ゆ","yu"],null,["よ","yo"],
  ["ら","ra"],["り","ri"],["る","ru"],["れ","re"],["ろ","ro"],
  ["わ","wa"],null,null,null,["を","wo","o"],
  ["ん","n","nn"],null,null,null,null,
];
const DAKUTEN = [
  ["が","ga"],["ぎ","gi"],["ぐ","gu"],["げ","ge"],["ご","go"],
  ["ざ","za"],["じ","ji","zi"],["ず","zu"],["ぜ","ze"],["ぞ","zo"],
  ["だ","da"],["ぢ","ji","di"],["づ","zu","du"],["で","de"],["ど","do"],
  ["ば","ba"],["び","bi"],["ぶ","bu"],["べ","be"],["ぼ","bo"],
  ["ぱ","pa"],["ぴ","pi"],["ぷ","pu"],["ぺ","pe"],["ぽ","po"],
];
const YOON = [
  ["きゃ","kya"],["きゅ","kyu"],["きょ","kyo"],
  ["しゃ","sha","sya"],["しゅ","shu","syu"],["しょ","sho","syo"],
  ["ちゃ","cha","tya","cya"],["ちゅ","chu","tyu","cyu"],["ちょ","cho","tyo","cyo"],
  ["にゃ","nya"],["にゅ","nyu"],["にょ","nyo"],
  ["ひゃ","hya"],["ひゅ","hyu"],["ひょ","hyo"],
  ["みゃ","mya"],["みゅ","myu"],["みょ","myo"],
  ["りゃ","rya"],["りゅ","ryu"],["りょ","ryo"],
  ["ぎゃ","gya"],["ぎゅ","gyu"],["ぎょ","gyo"],
  ["じゃ","ja","zya","jya"],["じゅ","ju","zyu","jyu"],["じょ","jo","zyo","jyo"],
  ["びゃ","bya"],["びゅ","byu"],["びょ","byo"],
  ["ぴゃ","pya"],["ぴゅ","pyu"],["ぴょ","pyo"],
];
const toKata = s => [...s].map(c => String.fromCharCode(c.charCodeAt(0) + 0x60)).join("");

const $ = id => document.getElementById(id);
const store = JSON.parse(localStorage.getItem("kanaPractice") || '{"miss":{},"seen":{},"best":0}');
const save = () => localStorage.setItem("kanaPractice", JSON.stringify(store));
let stats = {correct:0, total:0, streak:0};
let current = null, locked = false, last = null;

// ---------- speech ----------
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; u.rate = .8;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith("ja"));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

// ---------- pool ----------
function pool(){
  const script = document.querySelector('[name=script]:checked').value;
  const sets = [...document.querySelectorAll('#sets input:checked')].map(i => i.value);
  let base = [];
  if(sets.includes("basic")) base.push(...BASIC.filter(Boolean));
  if(sets.includes("dakuten")) base.push(...DAKUTEN);
  if(sets.includes("yoon")) base.push(...YOON);
  if(!base.length) base = BASIC.filter(Boolean);
  const out = [];
  for(const [h, ...r] of base){
    if(script.includes("h")) out.push({k:h, r});
    if(script.includes("k")) out.push({k:toKata(h), r});
  }
  return out;
}

// weighted pick: kana you miss come up more often
function pick(list){
  const w = list.map(x => 1 + 3 * (store.miss[x.k] || 0) / ((store.seen[x.k] || 0) + 1));
  let t = Math.random() * w.reduce((a,b) => a+b, 0);
  for(let i=0;i<list.length;i++){ t -= w[i]; if(t <= 0 && list[i].k !== last) return list[i]; }
  return list.find(x => x.k !== last) || list[0];
}

function next(){
  const list = pool();
  current = pick(list); last = current.k; locked = false;
  $("kana").textContent = current.k;
  $("feedback").textContent = ""; $("feedback").className = "feedback"; $("nextBtn").hidden = true;
  const mode = document.querySelector('[name=mode]:checked').value;
  $("typeBox").hidden = mode !== "type";
  $("choices").hidden = mode !== "choice";
  if(mode === "type"){
    $("input").value = ""; $("input").focus();
    $("hint").textContent = "Gõ cách đọc rồi nhấn Enter · Tab để bỏ qua · bấm vào chữ để nghe";
  } else {
    $("hint").textContent = "Chọn cách đọc đúng · có thể dùng phím 1–4 · bấm vào chữ để nghe";
    const opts = new Set([current.r[0]]);
    const others = list.filter(x => x.r[0] !== current.r[0]);
    while(opts.size < Math.min(4, others.length + 1)) opts.add(others[Math.floor(Math.random()*others.length)].r[0]);
    $("choices").innerHTML = "";
    [...opts].sort(() => Math.random() - .5).forEach((o,i) => {
      const b = document.createElement("button");
      b.textContent = o; b.dataset.r = o;
      b.onclick = () => answer(o, b);
      $("choices").appendChild(b);
    });
  }
}

function answer(val, btn){
  if(locked) return;
  val = val.trim().toLowerCase();
  if(!val) return;
  locked = true;
  const ok = current.r.includes(val);
  stats.total++;
  store.seen[current.k] = (store.seen[current.k] || 0) + 1;
  if(ok){
    stats.correct++; stats.streak++;
    store.best = Math.max(store.best, stats.streak);
    $("feedback").textContent = `正解！ Chính xác! ${current.k} = ${current.r[0]}`;
    $("feedback").className = "feedback ok";
  } else {
    stats.streak = 0;
    store.miss[current.k] = (store.miss[current.k] || 0) + 1;
    $("feedback").textContent = `Chưa đúng: ${current.k} đọc là “${current.r[0]}” — bấm Tiếp`;
    $("feedback").className = "feedback no";
    $("card").classList.remove("shake"); void $("card").offsetWidth; $("card").classList.add("shake");
  }
  if(btn){
    document.querySelectorAll("#choices button").forEach(b => {
      if(current.r.includes(b.dataset.r)) b.classList.add("right");
    });
    if(!ok) btn.classList.add("wrong");
  }
  speak(current.k);
  save(); render();
  $("nextBtn").hidden = false;
  if(btn) $("nextBtn").focus();
}

function render(){
  $("sCorrect").textContent = stats.correct;
  $("sAcc").textContent = stats.total ? Math.round(stats.correct / stats.total * 100) + "%" : "–";
  $("sStreak").textContent = stats.streak;
  $("sBest").textContent = store.best;
  const weak = Object.entries(store.miss).sort((a,b) => b[1]-a[1]).slice(0,12);
  $("weakList").innerHTML = weak.length
    ? weak.map(([k,n]) => `<span class="chip">${k}<small>×${n}</small></span>`).join("")
    : '<span class="tip">Chưa có — cố lên!</span>';
}

// ---------- chart ----------
function buildChart(){
  const kata = document.querySelector('[name=cs]:checked').value === "k";
  const conv = s => kata ? toKata(s) : s;
  const block = (title, rows, cls="") => `<h2>${title}</h2><div class="grid ${cls}">` +
    rows.map(x => x ? `<div class="cell" data-k="${conv(x[0])}"><div class="k">${conv(x[0])}</div><div class="r">${x[1]}</div></div>` : '<div class="cell empty"></div>').join("") + "</div>";
  $("chartBody").innerHTML = block("Cơ bản", BASIC) + block("Âm đục & bán đục (dakuten)", DAKUTEN) + block("Âm ghép (yōon)", YOON, "y");
}
$("chartBody").addEventListener("click", e => { const c = e.target.closest(".cell"); if(c) speak(c.dataset.k); });

// ---------- events ----------
$("input").addEventListener("keydown", e => {
  if(e.key === "Enter"){ if(locked) next(); else answer($("input").value); }
  if(e.key === "Tab"){ e.preventDefault(); if(!locked){ stats.streak = 0; render(); next(); } }
});
document.addEventListener("keydown", e => {
  if($("choices").hidden || !$("quiz").classList.contains("on")) return;
  const i = parseInt(e.key) - 1;
  const b = $("choices").children[i];
  if(b) answer(b.dataset.r, b);
});
$("nextBtn").addEventListener("click", next);
$("kana").addEventListener("click", () => speak(current.k));
$("kana").style.cursor = "pointer";
document.querySelectorAll("#script input, #sets input, #mode input").forEach(i => i.addEventListener("change", next));
document.querySelectorAll("[name=cs]").forEach(i => i.addEventListener("change", buildChart));
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button, .panel").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $(b.dataset.tab).classList.add("on");
  if(b.dataset.tab === "quiz") next();
});
$("reset").onclick = () => {
  if(!confirm("Xóa toàn bộ tiến độ đã lưu?")) return;
  store.miss = {}; store.seen = {}; store.best = 0; stats = {correct:0,total:0,streak:0};
  save(); render();
};
if("speechSynthesis" in window) speechSynthesis.getVoices();

buildChart(); render(); next();
</script>
</body>
</html>
